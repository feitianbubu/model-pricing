name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      # a re-run after its first attempt pushed a bump must build from that bump
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go test ./...
      # pushes build from the pinned basellm
      - name: commit output drift, then bump basellm when prices change
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          go run .
          git diff --quiet docs/ratio_config.json || git commit -m "chore: regenerate ratio_config" docs/ratio_config.json
          latest=$(git ls-remote https://github.com/basellm/llm-metadata refs/heads/main | cut -f1)
          echo "$latest" > data/basellm.sha
          go run .
          if git diff --quiet docs/ratio_config.json; then
            git checkout data/basellm.sha
          else
            git commit -m "chore: bump basellm to ${latest:0:7}" data/basellm.sha docs/ratio_config.json
          fi
          git push
      - run: go run .
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
